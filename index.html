.hint{position:absolute;transform:translate(-50%,-100%);font-size:44px;color:#ffd84a;text-shadow:0 2px 4px rgba(0,0,0,.5);animation:bob 1s ease-in-out infinite;pointer-events:none}

@keyframes bob{50%{margin-top:-14px}}@keyframes pulse{50%{opacity:.35}}
#goal{position:fixed;left:50%;top:10px;transform:translateX(-50%);background:var(--paper);border:3px solid var(--line);border-radius:999px;padding:8px 18px;font-weight:700;font-size:16px;box-shadow:0 3px 0 var(--line);white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;z-index:20}
#goal:empty{display:none}
#goal.mini{font-size:13px;padding:4px 12px;opacity:.92;max-width:min(62vw,420px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-width:2px;box-shadow:0 2px 0 var(--line)}#goal.mini .hint2{display:none}
#toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:#ff7aa2;color:#fff;font-weight:800;border-radius:999px;padding:6px 14px;animation:up 1.8s forwards}
@keyframes up{0%{opacity:0;transform:translateY(8px)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
#talk{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(760px,calc(100% - 24px));background:var(--paper);border:4px solid var(--line);border-radius:22px;box-shadow:0 5px 0 var(--line);padding:14px 16px 14px 14px;display:none;gap:14px;align-items:flex-start;z-index:25;min-height:120px}

#who{font-weight:800;color:#a0662d;font-size:15px;margin-bottom:4px}
#line{font-size:18px;line-height:1.5;white-space:pre-wrap}

#choices button.okpick{background:var(--mint);color:#fff;border-color:#3f9a7c;box-shadow:0 4px 0 #3f9a7c;text-align:center;font-weight:800}

#fader{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .5s;z-index:40}
#modal{position:fixed;inset:0;background:var(--shade);display:none;justify-content:center;z-index:35;padding:16px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
#modal.on{display:flex}

.zit{position:relative}.zit::after{content:'🔊';position:absolute;right:4px;top:4px;font-size:13px;background:#fff;border:2px solid var(--mint);border-radius:999px;padding:2px 4px}
.ztray{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;background:linear-gradient(#e9c79a,#dcb684);border:3px solid var(--line);border-radius:18px;padding:16px 10px}
.zit{background:rgba(255,255,255,.55);border:3px solid transparent;border-radius:16px;padding:6px;cursor:pointer;width:min(120px,26vw);height:min(120px,26vw);display:flex;align-items:center;justify-content:center}
.zit img{max-width:100%;max-height:100%;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
.zit.on{border-color:var(--mint);background:#eafff6}
.zok{min-height:8px;text-align:center}

.card{background:var(--paper);border:4px solid var(--line);border-radius:26px;box-shadow:0 6px 0 var(--line);padding:22px;max-width:520px;width:100%;text-align:center;margin:auto 0;flex:none}

.big{font:inherit;font-weight:800;font-size:19px;background:var(--mint);color:#fff;border:0;border-radius:18px;box-shadow:0 5px 0 #3f9a7c;padding:13px 26px;margin-top:14px;cursor:pointer}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 #3f9a7c}
.pick{display:flex;gap:14px;justify-content:center;margin:14px 0 4px;flex-wrap:wrap}
.pick button{background:#fff;border:4px solid var(--line);border-radius:20px;box-shadow:0 5px 0 var(--line);padding:6px;cursor:pointer;width:min(140px,27vw)}
.pick button img{width:100%;display:block;border-radius:12px}
.pick button.ok{border-color:var(--mint);box-shadow:0 5px 0 #3f9a7c}
.pick button.no{animation:shake .4s}
.pick.places{gap:10px}.pick.places button{width:min(112px,40vw)}.pick.places .word{font-size:16px;white-space:nowrap;padding:4px 8px}

.heroes button{width:min(150px,38vw)}
.word{display:inline-block;background:#fff3c4;border:3px solid #e6c15a;border-radius:14px;padding:4px 14px;font-weight:800;font-size:22px;margin:6px}
.spk{font:inherit;background:#fff;border:3px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:700}
.panhint{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:rgba(40,25,10,.7);color:#fff;border-radius:999px;padding:8px 16px;font-size:15px;z-index:24;pointer-events:none;animation:fadeout 4s forwards}

.langs button.on{border-color:var(--mint);box-shadow:0 2px 0 #3f9a7c}

#goal{cursor:pointer}
#goal .hint2{display:block;font-size:13px;font-weight:600;color:#8a7a6a;margin-top:2px}
#goal:has(.hint2){border-radius:22px}
.say{position:absolute;transform:translate(-50%,-100%);z-index:6000;text-align:center;background:#fff;border:2px solid var(--line);border-radius:20px;padding:10px 16px;font-size:22px;line-height:1.45;max-width:440px;width:max-content;box-shadow:0 2px 6px rgba(80,50,20,.18);pointer-events:none}
@media (max-width:600px){.langs button{min-height:84px;padding:10px 6px}.langs b{font-size:15px}
#goal{top:60px;white-space:normal;text-align:center;max-width:calc(100% - 24px)}#goal.mini{top:14px;white-space:nowrap}#toast{top:130px}
.say{font-size:26px;max-width:min(440px,92vw)}.bubble{font-size:26px}}
.say.below{transform:translate(-50%,0)}
.say.below::after{bottom:auto;top:-12px;border-top:0;border-bottom:11px solid var(--line)}
.say b{display:block;font-size:16px;color:#a0662d;margin-bottom:2px}
.say::after{content:'';position:absolute;left:calc(50% + var(--tail,0px));bottom:-12px;margin-left:-9px;border:9px solid transparent;border-top:11px solid var(--line);border-bottom:0}
.say.thinking{border-radius:999px;padding:12px 24px;color:#6a5a4a}
/* thought bubble: two small circles trailing down to the head instead of a pointed tail */
.say.thinking::before,.say.thinking::after{content:'';position:absolute;left:50%;border-radius:50%;background:#fff;border:2px solid var(--line);margin:0}
.say.thinking::before{width:22px;height:22px;bottom:-30px;margin-left:-18px}
.say.thinking::after{width:12px;height:12px;bottom:-48px;margin-left:-6px}
.say.thinking.below::before{bottom:auto;top:-30px}.say.thinking.below::after{bottom:auto;top:-48px;border-bottom:2px solid var(--line)}
#bag{position:fixed;right:12px;top:10px;z-index:21;background:var(--paper);border:3px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:800;box-shadow:0 3px 0 var(--line);display:none}
